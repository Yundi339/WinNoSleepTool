name: Build and Release

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build_win:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget
            zip

      - name: Install Build Tools
        shell: msys2 {0}
        run: |
          # 只安装需要的包，不升级系统
          pacman -S --needed --noconfirm \
            mingw-w64-ucrt-x86_64-cmake \
            mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-toolchain


      - name: Build Windows
        shell: msys2 {0}
        run: |
          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DCMAKE_BUILD_TYPE=Release
          ninja -C build

      - name: Get Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(date +%Y%m%d-%H%M%S)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Package Windows
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          cd build
          
          # 清理符号表，减小文件大小
          strip --strip-all WinNoSleepTool.exe
          
          # 打包并命名为带版本号的文件
          zip ../artifacts/WinNoSleepTool-${{ steps.version.outputs.version }}.zip WinNoSleepTool.exe

      - name: Generate Checksums
        shell: pwsh
        run: |
          cd artifacts
          Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 SHA256SUMS.txt
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-no-sleep-tool
          path: |
            artifacts/WinNoSleepTool-*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/WinNoSleepTool-*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}